
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estantería - Papá Noel</title>

    <!-- CONECTAR CSS Y JAVASCRIPT -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main id="contenedor-juego">

        <div id="pantalla">

            <!-- IMAGEN DE LA ESTANTERÍA -->
            <img id="estante" src="assets/estante.jpg" alt="Estantería con seis juguetes">

            <!-- TEXTO INFERIOR -->
            <div id="texto-estanteria">
                <p id="narracion"></p>
            </div>

            <!-- ZONAS INTERACTIVAS INVISIBLES -->

            <!-- JUGUETE 1: MATRIUSHKAS -->
            <div id="zona-matriushkas"></div>

            <!-- JUGUETE 2: ROBOT -->
            <div id="zona-robot"></div>

            <!-- JUGUETE 3: LIBROS -->
            <div id="zona-libros"></div>

            <!-- JUGUETE 4: OSO -->
            <div id="zona-oso"></div>

            <!-- JUGUETE 6: BALÓN -->
            <div id="zona-balon"></div>

            <!-- JUGUETE 5: MUÑECA -->
            <div id="zona-muneca"></div>

        </div>

    </main>
</body>
</html>
