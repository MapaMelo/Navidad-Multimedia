
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Envolver regalo - Papá Noel</title>

    <!-- CONECTAR CSS Y JAVASCRIPT -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main id="contenedor-juego">

        <div id="pantalla">

            <!-- IMAGEN DEL JUGUETE SOBRE EL PAPEL -->
            <img id="regalo" src="" alt="Regalo sobre el papel">

            <!-- CONTADOR -->
            <div id="contador">
                <p>REGALOS</p>
                <p id="cantidad-regalos">0/6</p>
            </div>

            <!-- PENSAMIENTO DE PAPÁ NOEL -->
            <div id="texto-envolver">
                <p id="narracion"></p>
            </div>

            <!-- GUÍA DEL GESTO -->
            <div id="guia-gesto">
                <p>PINCH TO ZOOM</p>
                <p>Junta dos dedos</p>
            </div>

            <!-- MENSAJE CUANDO EL REGALO ESTÁ ENVUELTO -->
            <div id="mensaje-final">
                <p>¡Regalo terminado!</p>
                <button id="boton-continuar">CONTINUAR</button>
            </div>

        </div>

    </main>
</body>
</html>
