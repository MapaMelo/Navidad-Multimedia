
<!doctype html>
<html lang="es">

<head>

    <!-- Permite utilizar tildes y caracteres especiales. -->
    <meta charset="utf-8">

    <!-- Adapta la página al tamaño de la pantalla del celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mapa - Papá Noel</title>

    <!-- Conecta los estilos CSS. -->
    <link rel="stylesheet" href="style.css">

    <!-- Conecta JavaScript y espera a que cargue el HTML. -->
    <script src="script.js" defer></script>

</head>

<body>

    <main id="contenedor-juego">

        <div id="pantalla">

            <!-- IMAGEN DEL MAPA -->
            <div id="mapa"></div>

            <!-- NARRACIÓN DE PAPÁ NOEL -->
            <div id="texto-mapa">
                <p id="narracion"></p>
            </div>

            <!-- ZONAS TÁCTILES DE LOS SEIS PAÍSES -->
            <div id="zona-estados-unidos" class="zona-pais"></div>
            <div id="zona-francia" class="zona-pais"></div>
            <div id="zona-colombia" class="zona-pais"></div>
            <div id="zona-nepal" class="zona-pais"></div>
            <div id="zona-egipto" class="zona-pais"></div>
            <div id="zona-nueva-zelanda" class="zona-pais"></div>

        </div>

    </main>

</body>
</html>
