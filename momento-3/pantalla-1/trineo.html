<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trineo - Papá Noel</title>

    <!-- CONECTAR CSS Y JAVASCRIPT -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<!-- EVITAR QUE APAREZCA EL MENÚ DEL NAVEGADOR AL MANTENER PRESIONADO -->
<body oncontextmenu="return false;">

    <main id="contenedor-juego">

        <div id="pantalla">

            <!-- IMAGEN DEL TRINEO -->
            <img id="trineo" src="assets/dedos0.jpg" alt="Trineo de Papá Noel">

            <!-- PENSAMIENTO DE PAPÁ NOEL -->
            <div id="texto-trineo">
                <p id="narracion"></p>
            </div>

            <!-- INSTRUCCIONES PARA EL GESTO -->
            <div id="guia-gesto">
                <p id="texto-guia">Apoya los cinco dedos sobre la pantalla</p>
            </div>

            <!-- BOTÓN PARA CONTINUAR -->
            <button id="boton-vamos">A TRABAJAR...</button>

        </div>

    </main>

</body>
</html>
