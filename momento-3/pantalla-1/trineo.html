<!doctype html>
<html lang="es">

<head>
    <!-- Permite utilizar tildes y caracteres especiales. -->
    <meta charset="utf-8">

    <!-- Adapta la página al tamaño de la pantalla del celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Trineo - Papá Noel</title>

    <!-- CONECTAR CSS Y JAVASCRIPT -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main id="contenedor-juego">

        <div id="pantalla">

            <!-- IMAGEN QUE CAMBIA SEGÚN LA CANTIDAD DE DEDOS -->
            <img id="trineo" src="assets/dedos0.jpg" alt="Trineo de Papá Noel">

            <!-- PENSAMIENTO DE PAPÁ NOEL -->
            <div id="texto-trineo">
                <p id="narracion"></p>
            </div>

            <!-- GUÍA DEL GESTO -->
            <div id="guia-gesto">
                <p id="texto-guia">Apoya los cinco dedos sobre la pantalla</p>
            </div>

            <!-- BOTÓN QUE APARECE DESPUÉS DE CINCO SEGUNDOS -->
            <button id="boton-vamos">A TRABAJAR...</button>

        </div>

    </main>

</body>
</html>
